[pytest]
testpaths = tests
pythonpath = .
addopts = -v
markers =
    smoke: quick health checks, run on every build
    regression: full functional suite

# Live logging: INFO shows one line per API call, DEBUG adds request/response bodies
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
